name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=80 --durations=10

  test-postgres:
    runs-on: ubuntu-latest
    # Runs the suite against a STOCK pgvector image (provides `vector` +
    # `pg_trgm` but NOT the optional `pg_search`/`age`). This gives the central
    # Postgres backend real CI coverage — the ~315 postgres tests skip in every
    # other job, which install no database — and deliberately exercises the
    # optional-extension-missing bootstrap path so a regression of that path
    # (an optional-extension rollback discarding the required extensions) fails
    # CI. Do NOT switch this to a ParadeDB image: the missing optionals are the
    # point.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mempalace
          POSTGRES_PASSWORD: mempalace
          POSTGRES_DB: mempalace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mempalace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEMPALACE_TEST_PG_URL: postgresql://mempalace:mempalace@localhost:5432/mempalace
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev,postgres]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --durations=10

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=80 --durations=10

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=80 --durations=10
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
      # Keep this pin identical to the `ruff==` pin in pyproject.toml
      # ([project.optional-dependencies].dev and [dependency-groups].dev)
      # so CI and `pip install -e ".[dev]"` format/lint identically.
      - run: pip install "ruff==0.15.14"
      - run: ruff check .
      - run: ruff format --check .
