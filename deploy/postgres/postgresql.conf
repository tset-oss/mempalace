# MemPalace central PostgreSQL configuration.
#
# Dev-friendly defaults sized for a laptop / small shared box. Scale the memory
# settings up for a real central deployment (see the comments). The one line
# that is NOT optional is `shared_preload_libraries` — pg_search will not work
# without it, and AGE relies on it for graph function availability.

# === Extensions (REQUIRED) ===
# pg_search (ParadeDB BM25) MUST be preloaded; AGE is preloaded too so its
# functions are available without a per-session LOAD in most paths.
shared_preload_libraries = 'pg_search,age'

# === Memory (dev defaults — raise for production) ===
# Production guidance: shared_buffers ~= 25% RAM, effective_cache_size ~= 60% RAM.
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 32MB
maintenance_work_mem = 256MB

# === WAL / Checkpoints ===
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# === Connections ===
# MemPalace is internal/engineering-only with no auth; keep a generous ceiling
# but cap the client-side pool (MEMPALACE_PG_POOL_MAX) so concurrent users do
# not exhaust this.
max_connections = 100

# === Query Planner (SSD) ===
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# === Safety / Timeouts ===
statement_timeout = 60000
idle_in_transaction_session_timeout = 120000

# === Logging (observability) ===
log_min_duration_statement = 1000
log_checkpoints = on

# === Network ===
# Internal network only — bind all interfaces so the container is reachable.
listen_addresses = '*'
