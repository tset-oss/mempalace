# Central MemPalace — PostgreSQL (pgvector vectors + pg_trgm keyword recall +
# Apache AGE graph; pg_search is provisioned but the query path does not use it
# for retrieval) plus the HTTP MCP server (FastMCP, streamable-http) that
# engineers' Claude Code connects to.
#
#   cd deploy && cp .env.example .env   # then set MEMPALACE_AUTH_TOKEN
#   docker compose up -d --build
#
# Internal/engineering use only. Postgres has no auth beyond its static
# credentials — do not expose port 5432 publicly. The MCP server (port 8080) is
# gated by a shared bearer token (MEMPALACE_AUTH_TOKEN); keep it behind the org
# network / a TLS-terminating reverse proxy before exposing it.
services:
  db:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: mempalace-postgres:18
    container_name: mempalace-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mempalace
      POSTGRES_USER: mempalace
      POSTGRES_PASSWORD: mempalace  # pragma: allowlist secret
    shm_size: "1g"
    volumes:
      # postgres:18+ stores data in a major-version subdirectory.
      # Mount at /var/lib/postgresql so PG18 can create the versioned subdir.
      - mempalace_pgdata:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mempalace -d mempalace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # HTTP MCP server (FastMCP, streamable-http) — what each engineer's Claude
  # Code connects to. Backed by the `db` service; gated by a shared bearer token.
  mcp:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    image: mempalace-mcp:latest
    container_name: mempalace-mcp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MEMPALACE_BACKEND: postgres
      # Multilingual embeddings (embeddinggemma-300m, 100+ languages, 384-dim).
      # Pre-baked into the image (see deploy/server/Dockerfile) so no model is
      # downloaded at request time. Set this BEFORE the first ingest — changing
      # the embedding model on a populated palace needs `repair rebuild-index`
      # (different vector space).
      MEMPALACE_EMBEDDING_MODEL: embeddinggemma
      # Reach the db service over the compose network (not localhost).
      MEMPALACE_DATABASE_URL: postgresql://mempalace:mempalace@db:5432/mempalace  # pragma: allowlist secret
      # Centralise the write-ahead audit log alongside the data.
      MEMPALACE_WAL_SINK: postgres
      # Shared static bearer token — REQUIRED. `?err` fails the up if unset, so
      # the server is never started unauthenticated by accident. Set it in .env.
      MEMPALACE_AUTH_TOKEN: ${MEMPALACE_AUTH_TOKEN:?set MEMPALACE_AUTH_TOKEN in deploy/.env}
    restart: unless-stopped

volumes:
  mempalace_pgdata:
